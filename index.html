const stories=[{"emoji":"♟️","title":"The Chessboard and the Grains of Wheat","subtitle":"Geometric progressions · 6–8 minutes","lesson":5,"kind":"Mathematical legend","vocab":["grain","double","common ratio","geometric progression"],"panels":[["A brilliant idea","In a faraway kingdom, an inventor named Sia showed the king a new game: chess. The king was delighted and offered him a reward.","🏰"],["A strange request","“I ask for only one grain of wheat on the first square,” said Sia. “Put two on the next square, then double the number on every new square.”","🌾"],["The king laughs","“Just a few grains?” the king asked. “You could have gold!” Sia smiled. “I prefer wheat, Your Majesty.”","👑"],["A surprising pattern","The royal accountant counted: 1, 2, 4, 8, 16, 32... “Every term is twice the previous term!” she said. “The common ratio is two.”","📈"],["A growing mountain","At square 10, there were 512 grains. At square 20, there were 524,288. The king watched the numbers grow faster than anyone expected.","⛰️"],["The last square","“Square 64 alone needs 2⁶³ grains,” the accountant explained. “That is 9,223,372,036,854,775,808 grains!” The king was speechless.","♟️"],["The total reward","To count all 64 squares, she used the finite geometric sum: 1 + 2 + 4 + ... + 2⁶³ = 2⁶⁴ − 1 grains. It was far more than the kingdom could provide.","🧮"],["The lesson","Sia said, “Small beginnings can lead to enormous results when a number is multiplied again and again.” The king finally understood the power of geometric growth.","✨"]],"questions":[{"q":"What is the common ratio in the wheat sequence?","options":["1","2","4","64"],"correct":1,"en":"Each square has twice as many grains as the previous one.","vi":"Mỗi ô có số hạt gấp đôi ô trước nên công bội là 2."},{"q":"How many grains are on the fourth square?","options":["4","6","8","16"],"correct":2,"en":"The first four terms are 1, 2, 4, 8.","vi":"Bốn số hạng đầu là 1, 2, 4, 8."},{"q":"What does “double” mean in the story?","options":["Add one","Multiply by two","Divide by two","Subtract two"],"correct":1,"en":"To double a number means to multiply it by 2.","vi":"Double nghĩa là nhân đôi, tức nhân với 2."}]},{"emoji":"🧒","title":"Young Gauss and the Secret of 101","subtitle":"Arithmetic series · 5–7 minutes","lesson":4,"kind":"Historical anecdote (details uncertain)","vocab":["pair","sum","arithmetic series","consecutive"],"panels":[["A busy classroom","One morning, a teacher wrote a challenge on the board: “Add every whole number from 1 to 100.” The pupils began writing long calculations.","🏫"],["A quiet thinker","Young Gauss looked at the numbers. “There must be a quicker way,” he thought. He noticed that the first and last numbers belonged together.","🤔"],["The first pair","“One plus one hundred is one hundred and one,” he whispered. He wrote 1 + 100 = 101.","✏️"],["A second discovery","He tried another pair: 2 + 99 = 101. Then 3 + 98 = 101. Every pair had the same sum!","🔗"],["Counting the pairs","There were 100 numbers. Pairing the first with the last produced 50 pairs. Each pair added up to 101.","🔢"],["The answer","Gauss multiplied 50 × 101 and wrote 5,050. He finished while the other pupils were still adding.","🎯"],["The explanation","“I did not add one by one,” he explained. “I found a pattern and used it to calculate the sum.”","💡"],["The mathematical connection","The numbers 1, 2, 3, ... , 100 form an arithmetic progression. The sum is S₁₀₀ = 100(1 + 100)/2 = 5,050. The classroom story is a famous anecdote, not a fully verified historical event.","📚"]],"questions":[{"q":"What is the sum of the numbers from 1 to 100?","options":["101","1,000","5,050","10,100"],"correct":2,"en":"There are 50 pairs, each with a sum of 101: 50 × 101 = 5,050.","vi":"Có 50 cặp, mỗi cặp tổng bằng 101 nên tổng là 5.050."},{"q":"How many pairs did Gauss make?","options":["25","50","99","100"],"correct":1,"en":"One hundred numbers can be grouped into 50 pairs.","vi":"100 số được ghép thành 50 cặp."},{"q":"What does “sum” mean?","options":["A difference","A total after addition","A common ratio","A term position"],"correct":1,"en":"A sum is the result of adding numbers.","vi":"Sum là tổng, kết quả của phép cộng."}]}];

let soundOn=localStorage.getItem('mathlingo_sound')!=='off';let audioCtx=null;
function toggleSound(){soundOn=!soundOn;localStorage.setItem('mathlingo_sound',soundOn?'on':'off');updateSound();if(soundOn)playFeedback(false)}
function updateSound(){const e=$('soundtoggle');if(e)e.textContent=soundOn?'🔊 Sound on':'🔇 Sound off'}
function playFeedback(ok){
 if(!soundOn)return;
 try{
  const C=window.AudioContext||window.webkitAudioContext;
  if(!C){if(!ok && 'speechSynthesis' in window){const u=new SpeechSynthesisUtterance('Try again');u.lang='en-US';speechSynthesis.speak(u)}return}
  audioCtx=audioCtx||new C();
  const play=()=>{
   const t=audioCtx.currentTime+.015;
   const notes=ok?[659.25,783.99,1046.5]:[392,293.66,196];
   notes.forEach((freq,i)=>{
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type=ok?'sine':'sawtooth';o.frequency.setValueAtTime(freq,t+i*.16);
    o.connect(g);g.connect(audioCtx.destination);
    const st=t+i*.16;
    g.gain.setValueAtTime(.0001,st);
    g.gain.exponentialRampToValueAtTime(ok?.16:.23,st+.025);
    g.gain.exponentialRampToValueAtTime(.0001,st+.21);
    o.start(st);o.stop(st+.22);
   });
  };
  if(audioCtx.state==='suspended')audioCtx.resume().then(play).catch(()=>{});else play();
 }catch(e){console.warn('Audio feedback unavailable:',e)}
}
function testSound(){if(!soundOn){soundOn=true;localStorage.setItem('mathlingo_sound','on');updateSound()}playFeedback(false)}

let activeRecognition=null;
function micMessage(message,kind='info'){
 const box=$('micstatus');if(!box)return;
 box.className='micstatus mic-'+kind;box.textContent=message;
}
function normalizedSpeech(value){return String(value||'').toLowerCase().normalize('NFKD').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function stopPronunciation(){if(activeRecognition){try{activeRecognition.abort()}catch(e){}activeRecognition=null}micMessage('Microphone stopped. / Đã dừng ghi âm.');}
async function startPronunciation(){
 const words=getWords();if(!words.length)return;
 const word=words[idx%words.length];const target=word.en;
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(activeRecognition){stopPronunciation();return}
 if(location.protocol==='file:'){
   micMessage('⚠️ Bạn đang mở file HTML trực tiếp (file://). Hãy chạy START_MATHLINGO_WINDOWS.bat rồi mở http://localhost:8765 để dùng microphone.','error');return;
 }
 if(!window.isSecureContext){micMessage('⚠️ Microphone requires HTTPS or localhost. / Hãy mở trang bằng HTTPS hoặc localhost.','error');return}
 if(!SR){micMessage('⚠️ Trình duyệt chưa hỗ trợ Speech Recognition. Hãy thử Chrome hoặc Edge bản mới.','error');return}
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){micMessage('⚠️ Trình duyệt không cho phép truy cập microphone. Hãy kiểm tra HTTPS/localhost và cài đặt trình duyệt.','error');return}
 micMessage('Đang xin quyền sử dụng microphone… / Requesting microphone access…');
 try{
   const stream=await navigator.mediaDevices.getUserMedia({audio:true});
   stream.getTracks().forEach(track=>track.stop());
 }catch(e){
   const err=e&&e.name;
   const help=err==='NotAllowedError'?'Bạn đã từ chối quyền micro. Nhấn biểu tượng ổ khóa bên trái địa chỉ → Microphone → Allow rồi tải lại trang.':err==='NotFoundError'?'Không tìm thấy microphone. Hãy kết nối micro và kiểm tra cài đặt Windows.':'Không thể truy cập microphone. Hãy đóng ứng dụng khác đang sử dụng micro và thử lại.';
   micMessage('⚠️ '+help,'error');return;
 }
 try{
   const rec=new SR();activeRecognition=rec;
   rec.lang='en-US';rec.interimResults=false;rec.maxAlternatives=5;rec.continuous=false;
   rec.onstart=()=>micMessage('🔴 Đang nghe… Hãy đọc: “'+target+'”. Nhấn 🎙️ Speak lần nữa để dừng.','listening');
   rec.onresult=e=>{
     const alternatives=Array.from(e.results[0]).map(x=>x.transcript);
     const match=alternatives.some(t=>normalizedSpeech(t)===normalizedSpeech(target));
     const heard=alternatives[0]||'';
     micMessage(match?'✅ Recognized: “'+target+'”. Well done! / Hệ thống nhận diện đúng từ.':'💡 Heard: “'+heard+'”. Target: “'+target+'”. Try again! / Hãy nghe mẫu rồi thử lại.',match?'good':'info');
     playFeedback(match);
   };
   rec.onerror=e=>{
     const messages={"not-allowed":"Microphone bị chặn. Cho phép micro trong cài đặt trang rồi thử lại.","service-not-allowed":"Dịch vụ nhận diện giọng nói bị chặn trên trình duyệt.","no-speech":"Không nghe thấy giọng nói. Hãy nói rõ hơn và thử lại.","audio-capture":"Không thu được âm thanh từ microphone. Kiểm tra thiết bị đầu vào.","network":"Dịch vụ nhận diện giọng nói cần kết nối mạng hoặc đang không khả dụng. Kiểm tra Internet và thử Chrome/Edge.","language-not-supported":"Trình duyệt chưa hỗ trợ nhận diện tiếng Anh (en-US).","aborted":"Đã dừng luyện phát âm."};
     micMessage('⚠️ '+(messages[e.error]||('Speech recognition error: '+e.error)),'error');
   };
   rec.onnomatch=()=>micMessage('Chưa nhận diện được từ. Hãy nghe mẫu và đọc lại.','info');
   rec.onend=()=>{if(activeRecognition===rec)activeRecognition=null};
   rec.start();
 }catch(e){activeRecognition=null;micMessage('⚠️ Không thể bắt đầu nhận diện giọng nói: '+(e.message||e),'error')}
}

uizType==='meaning'?'vi':quizType==='definition'?'def':'en';const used=new Set([opts[0]]);opts=[opts[0],...vocab.filter(x=>x.id!==w.id).map(x=>x[field]).filter(v=>{if(used.has(v))return false;used.add(v);return true}).slice(0,3)];}opts.sort(()=>Math.random()-.5);window.currentCorrect=correct;window.currentOpts=opts;box.innerHTML=`<div class="panel quiz"><div class="barrow"><span class="tag">Question ${qi+1}/${quiz.length}</span><strong>${quizScore} points</strong></div><div class="progress"><span style="width:${percent(qi,quiz.length)}%"></span></div><div class="question">${prompt}</div><div class="answers">${opts.map((o,i)=>`<button id="ans${i}" class="answer" onclick="answer(${i})">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}</div><div id="feedback"></div></div>`;if(quizType==='listen')speak(w.en)}

function factVisual(kind){
 const base=(body)=>`<svg viewBox="0 0 480 175" role="img" aria-label="Mathematical infographic" style="width:100%;height:175px">${body}</svg>`;
 const t=(x,y,value,size=22,color='#2b3372')=>`<text x="${x}" y="${y}" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="${size}" fill="${color}">${value}</text>`;
 if(kind==='chess')return base(Array.from({length:16},(_,i)=>`<rect x="${90+i%8*37}" y="${15+Math.floor(i/8)*37}" width="37" height="37" fill="${(Math.floor(i/8)+i%8)%2?'#7770d9':'#f3e4ba'}"/>`).join('')+t(240,128,'1 → 2 → 4 → 8 → 16',24));
 if(kind==='pairs')return base(t(240,45,'1 + 100 = 101',26)+t(240,87,'2 + 99 = 101',26)+t(240,137,'50 × 101 = 5,050',28,'#0d9c8d'));
 if(kind==='saving')return base([1,2,3,4].map((n,i)=>`<rect x="${55+i*103}" y="${140-n*25}" width="63" height="${n*25}" rx="7" fill="${['#8880ed','#7776df','#49b8c6','#18b89e'][i]}"/>${t(86+i*103,155,'W'+n,16)}`).join('')+t(240,25,'+10,000 VND / week',22));
 if(kind==='fibonacci')return base([1,1,2,3,5,8].map((n,i)=>`<circle cx="${42+i*79}" cy="77" r="30" fill="${i%2?'#5f61d8':'#1ab9a7'}"/>${t(42+i*79,85,n,24,'white')}`).join('')+t(240,151,'Add the previous two terms',20));
 return base([1,1,2,3,5,8].map((n,i)=>`<circle cx="${45+i*77}" cy="${85-(i%2)*12}" r="${16+n*2}" fill="none" stroke="${i%2?'#8a70df':'#20b7a5'}" stroke-width="6"/>${t(45+i*77,92-(i%2)*12,n,20)}`).join('')+t(240,160,'Patterns in nature',21));
}

function startGapQuiz(){quizType='gap';quiz=[...(gapBank[chosenChapter]||[])].sort(()=>Math.random()-.5);qi=0;chosen=null;quizScore=0;renderGapQuiz()}
function renderGapQuiz(){const box=$('quizbox');if(!box)return;if(qi>=quiz.length){box.innerHTML=`<div class="panel quiz"><h2>Fill in the Gap completed!</h2><p>${quizScore} / ${quiz.length} correct</p><button class="btn" onclick="startGapQuiz()">Try again</button></div>`;return;}const item=quiz[qi];const options=[...item[2]].sort(()=>Math.random()-.5);window.gapOptions=options;box.innerHTML=`<div class="panel quiz"><div class="barrow"><span class="tag">Question ${qi+1}/${quiz.length}</span><strong>${quizScore} points</strong></div><div class="question">Complete the sentence:<p>${esc(item[0])}</p></div><div class="answers">${options.map((o,i)=>`<button class="answer" id="ans${i}" onclick="answerGap(${i})">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}</div><div id="feedback"></div></div>`}
function answerGap(i){if(chosen!==null)return;chosen=i;const item=quiz[qi],ok=window.gapOptions[i]===item[1];if(ok)quizScore++;playFeedback(ok);window.gapOptions.forEach((v,j)=>{const b=$('ans'+j);b.disabled=true;if(v===item[1])b.classList.add('correct');else if(j===i)b.classList.add('wrong')});$('feedback').innerHTML=`<div class="feedback ${ok?'good':'bad'}"><strong>${ok?'Correct!':'Review the answer'}</strong><p><b>EN:</b> ${esc(item[3])}</p><p><b>VI:</b> ${esc(item[4])}</p><button class="btn small" onclick="qi++;chosen=null;renderGapQuiz()">${qi===quiz.length-1?'See results':'Next question →'}</button></div>`}

function normalizeMath(v){return String(v).trim().toLowerCase().replace(/\s+/g,'').replace(/,/g,'.').replace(/π/g,'pi').replace(/°/g,'')}

function submitMathShort(){if(window.mathAnswer!==undefined)return;const input=document.getElementById('v11short');if(!input||!input.value.trim())return;const a=input.value;window.mathAnswer=a;let q=getMathCurrent();const ok=q.answer.some(v=>normalizeMath(v)===normalizeMath(a));playFeedback(ok);state.mathDone=state.mathDone||[];state.mathDone.push({id:q.id,correct:ok});if(ok)state.xp+=5;save();render()}
